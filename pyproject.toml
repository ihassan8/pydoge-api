[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pydoge_api"
description = "PyDOGE API is an advanced, Python wrapper for interacting with the public-facing API of the Department of Government Efficiency (DOGE)"
authors = [
    {name = "Hassan, Muhammad", email = "blazebyte2@gmail.com"}
]
readme = "README.md"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.8"
keywords = ["doge", "government efficiency", "savings", "contracts", "payments", "api", "sdk"]

dynamic = ["version", "dependencies", "optional-dependencies"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/ihassan8/pydoge-api"
Documentation = "https://ihassan8.github.io/pydoge-api"
Repository = "https://github.com/ihassan8/pydoge-api"
"Bug Tracker" = "https://github.com/ihassan8/pydoge-api/issues/new"

[project.scripts]
pydoge = "pydoge_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydoge_api = ["py.typed"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.dev = {file = ["requirements-dev.txt"]}
optional-dependencies.docs = {file = ["requirements-docs.txt"]}
optional-dependencies.viz = {file = ["requirements-viz.txt"]}

[tool.setuptools_scm]
# Auto-generate _version.py from the corresponding git tag.
version_file = "src/pydoge_api/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Recent mypy releases dropped 3.8/3.9 as analysis targets — runtime support for
# 3.8+ is verified by the CI test matrix (3.8 through 3.12). 3.10 is the lowest
# target current mypy accepts.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"
line-length = 120
# _version.py is auto-generated by setuptools_scm at install time. Its quoting
# style depends on the generator, not our codebase, so we exclude it from both
# lint and format checks rather than fighting a regenerating file.
extend-exclude = ["src/pydoge_api/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
