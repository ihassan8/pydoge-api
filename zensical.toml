[project]
site_name        = "PyDOGE API"
site_description = "An advanced Python wrapper for the public-facing API of the Department of Government Efficiency (DOGE)."
site_url         = "https://ihassan8.github.io/pydoge-api"
site_dir         = "public"
docs_dir         = "docs"

repo_name = "pydoge-api"
repo_url  = "https://github.com/ihassan8/pydoge-api"
edit_uri  = "edit/main/docs/"

strict              = false
use_directory_urls  = true
exclude_docs        = "*.py"

extra_css        = ["css/extra.css"]
extra_javascript = ["js/extra.js"]

# ── Navigation ────────────────────────────────────────────────────────────

nav = [
  {"Home" = [
    {"Overview" = "index.md"},
  ]},
  {"Getting Started" = [
    {"Quickstart"         = "usage.md"},
    {"Exports & Summary"  = "usage_exports.md"},
    {"Visualization"      = "visualization.md"},
    {"CLI"                = "cli.md"},
    {"Advanced Usage"     = "advanced.md"},
    {"Logging"            = "logging.md"},
  ]},
  {"Analytics" = [
    {"Engine"        = "reference/analytics.md"},
    {"Top Agencies"  = "reference/analytics_agencies.md"},
  ]},
  {"Endpoints" = [
    {"Savings"  = "reference/savings.md"},
    {"Payments" = "reference/payments.md"},
  ]},
  {"API Reference" = [
    {"DogeAPI" = "reference/api.md"},
    {"Client"  = "reference/client.md"},
    {"Models — Savings"  = "reference/models_savings.md"},
    {"Models — Payments" = "reference/models_payments.md"},
    {"Utilities"         = "reference/utils_export.md"},
  ]},
]

# ── Theme ─────────────────────────────────────────────────────────────────

[project.theme]
logo     = "img/logo.PNG"
favicon  = "img/favicon/favicon.ico"
language = "en"
custom_dir = "docs/overrides"

font.text = "DM Sans"
font.code = "JetBrains Mono"

features = [
  # Navigation
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  # TOC
  "toc.follow",
  # Search
  "search.suggest",
  "search.highlight",
  "search.share",
  # Header
  "header.autohide",
  "announce.dismiss",
  # Content
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "content.action.view",
]

[project.theme.icon]
logo = "material/dog-service"
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

# Dark mode (default)
[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "indigo"
accent      = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Light mode
[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "indigo"
accent      = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# ── Plugins ───────────────────────────────────────────────────────────────

[project.plugins.search]
separator = '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

[project.plugins.git-authors]

[project.plugins.git-revision-date-localized]
enable_creation_date = true
type = "timeago"

[project.plugins.autorefs]
resolve_closest = true

[project.plugins.mkdocstrings]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style          = "numpy"
docstring_section_style  = "spacy"
filters                  = ["!^_"]
heading_level            = 2
inherited_members        = false
merge_init_into_class    = true
parameter_headings       = true
show_root_heading        = true
show_root_full_path      = false
show_signature           = true
show_signature_annotations = true
show_source              = true
show_symbol_type_heading = true
show_symbol_type_toc     = true
signature_crossrefs      = true
summary                  = true
members_order            = "source"

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true

# ── Markdown Extensions ───────────────────────────────────────────────────

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink       = true
permalink_title = "Link to this section"
toc_depth       = 3

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index     = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums    = true
line_spans         = "__span"
pygments_lang_class = true
auto_title         = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.magiclink]
normalize_issue_symbols = true
repo_url_shorthand      = true
user                    = "ihassan8"
repo                    = "pydoge-api"

[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style    = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

# ── Extra ─────────────────────────────────────────────────────────────────

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ihassan8/pydoge-api"
name = "PyDOGE API on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pydoge-api/"
name = "PyDOGE API on PyPI"
